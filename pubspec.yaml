name: paso_del_rio
description: "Gestion offline-first para Paso del Rio: Android, Windows y Firebase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  http: ^1.5.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  uuid: ^4.5.1
  audioplayers: ^6.0.0
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/Logo 02.jpg
    - assets/audio/nature_ambience.mp3