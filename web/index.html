<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="PWA de gestión offline-first para Paso del Río Eco Hotel & Restaurante">
  <meta name="theme-color" content="#1B4332">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Paso del Río">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>

  <title>Paso del Río - Eco Hotel & Restaurante</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1B4332;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #pwa-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #245842 0%, #143B30 100%);
      color: #FFFFFF;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }

    .pwa-logo-box {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      background: #1B4332;
      border: 2px solid #E5C158;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }

    .pwa-logo-box span {
      font-size: 32px;
      font-weight: 800;
      color: #E5C158;
      letter-spacing: 1px;
    }

    .pwa-title {
      font-size: 22px;
      font-weight: 700;
      color: #E5C158;
      letter-spacing: 1.5px;
      margin: 0;
      text-transform: uppercase;
    }

    .pwa-subtitle {
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 6px;
      text-transform: uppercase;
    }

    .pwa-spinner {
      margin-top: 32px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(229, 193, 88, 0.2);
      border-top-color: #E5C158;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="pwa-loading">
    <div class="pwa-logo-box">
      <span>PdR</span>
    </div>
    <div class="pwa-title">Paso del Río</div>
    <div class="pwa-subtitle">Eco Hotel & Restaurante</div>
    <div class="pwa-spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('pwa-loading');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
